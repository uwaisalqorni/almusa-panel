server {
    listen 64448 default_server;
    listen [::]:64448 default_server;
    server_name _;

    root /www/panel/public;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    # Access & Error Logs
    access_log /var/log/nginx/almusa_access.log;
    error_log /var/log/nginx/almusa_error.log warn;

    # Modern Security Headers (OWASP Compliant)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Max body size
    client_max_body_size 50M;

    # PHP2Shell & RCE Exploit Mitigation (CVE-2026-109618, CVE-2026-109619, CVE-2024-4577)
    if ($query_string ~* "(php://(input|filter)|data://|expect://|phar://|base64_decode|eval\(|gzinflate|\.\./|%2e%2e|-d[\s+]+|--define|auto_prepend_file|auto_append_file|allow_url_include)") {
        return 403;
    }

    if ($request_uri ~* "(php://|data://|expect://|phar://|base64_decode|eval\(|gzinflate|\.\./|\.\.\\|%2e%2e)") {
        return 403;
    }

    # Static Assets bypass directly to Nginx (high performance)
    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Route all requests to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/almusa-panel.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
        fastcgi_intercept_errors off;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny hidden files (.git, .env, data, etc.)
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ^~ /data/ {
        deny all;
    }
}
