[global]
pid = /run/almusa-panel-fpm.pid
error_log = /home/afandi/almusa-panel/data/panel_fpm_error.log
daemonize = no

[almusa-panel]
user = afandi
group = afandi
listen = /run/php/almusa-panel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Environment settings
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; PHP Admin Flags
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 50M
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /home/afandi/almusa-panel/data/panel_php_error.log
