[global]
pid = /run/almusa-panel-fpm.pid
error_log = /www/panel/data/panel_fpm_error.log
daemonize = no

[almusa-panel]
; Panel berjalan sebagai user khusus 'almusa', BUKAN www-data (user website).
; group www-data dipakai agar file yang dibuat file manager tetap bisa ditulis website.
user = almusa
group = www-data
; Socket hanya untuk nginx: website (www-data) tidak boleh bisa menyambung langsung
; ke FPM panel (bisa menyuntik SCRIPT_FILENAME/PHP_VALUE dan menjalankan kode sebagai panel).
listen = /run/php/almusa-panel.sock
listen.owner = almusa
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Environment settings
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; PHP Admin Flags
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 1024M
php_admin_value[post_max_size] = 1024M
php_admin_value[max_execution_time] = 600
php_admin_value[max_input_time] = 600
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /www/panel/data/panel_php_error.log

; Sesi panel disimpan di folder privat (bukan /var/lib/php/sessions yang dipakai bersama website)
php_admin_value[session.save_path] = /www/panel/data/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[session.gc_maxlifetime] = 86400

; OPcache Performance Optimization for Panel
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.enable_cli] = 0
php_admin_value[opcache.memory_consumption] = 32
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 2000
php_admin_value[opcache.revalidate_freq] = 60
php_admin_value[opcache.save_comments] = 1
