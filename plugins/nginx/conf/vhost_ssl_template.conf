# ==============================================================================
# Almusa Server Control Panel - Virtual Host with Let's Encrypt SSL
# Domain: {{DOMAIN}}
# ==============================================================================

# HTTP Server: ACME Challenge & HTTP to HTTPS 301 Redirect
server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}} {{ALIASES}};

    # Let's Encrypt ACME Challenge verification
    location ^~ /.well-known/acme-challenge/ {
        root {{DOCROOT}};
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Virtual Host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8088;
    listen [::]:8088;
    server_name {{DOMAIN}} {{ALIASES}};

    root {{DOCROOT}};
    index index.php index.html index.htm;

    # Charset
    charset utf-8;

    # SSL Certificate & Private Key
    ssl_certificate {{SSL_CERT}};
    ssl_certificate_key {{SSL_KEY}};

    # Modern SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Access & Error Logs
    access_log {{ACCESS_LOG}};
    error_log {{ERROR_LOG}} warn;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ==========================================================================
    # PHP2Shell & RCE Exploit Mitigation (CVE-2026-109618, CVE-2026-109619, CVE-2024-4577)
    # ==========================================================================
    # 1. Block PHP stream wrappers, eval functions, argument injection & traversal in query string
    if ($query_string ~* "(php://(input|filter)|data://|expect://|phar://|base64_decode|eval\(|gzinflate|\.\./|%2e%2e|-d[\s+]+|--define|auto_prepend_file|auto_append_file|allow_url_include)") {
        return 403;
    }

    # 2. Block malicious URI stream manipulation & directory traversal
    if ($request_uri ~* "(php://|data://|expect://|phar://|base64_decode|eval\(|gzinflate|\.\./|\.\.\\|%2e%2e)") {
        return 403;
    }

    # 3. Block direct PHP/PHTML/PHAR execution inside upload & storage directories
    location ~* /(uploads|storage|public/uploads|wp-content/uploads)/.*\.ph(p[3-8]?|t|tml|ar)$ {
        deny all;
        return 403;
    }

    # URL Rewrite Configuration
    include {{REWRITE_CONF}};

    # PHP-FPM Execution with CVE-2019-11043 & Path Traversal Guard
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass {{PHP_SOCK}};
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # Static Assets Caching
    location ~* \.(jpg|jpeg|gif|png|webp|svg|css|js|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Block sensitive hidden files (.git, .env, .htaccess)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
